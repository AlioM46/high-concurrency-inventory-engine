services:
  postgres:
    image: postgres:16-alpine
    container_name: stockforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockforge
      POSTGRES_USER: stockforge
      POSTGRES_PASSWORD: secrett
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockforge -d stockforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockforge_network

  redis:
    image: redis:7-alpine
    container_name: stockforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockforge_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockforge_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockforge_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockforge_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockforge_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  stockforge_network:
    driver: bridge
